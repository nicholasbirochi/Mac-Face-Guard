name: MacFaceGuard
options:
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
targets:
  MacFaceGuardCore:
    type: framework
    platform: macOS
    sources: [Sources/MacFaceGuardCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macfaceguard.local.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  MacFaceGuard:
    type: application
    platform: macOS
    sources:
      - path: Sources/MacFaceGuardApp
      - path: docs/images/AppIcon.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macfaceguard.local
        INFOPLIST_FILE: scripts/Info.plist
        CODE_SIGN_ENTITLEMENTS: scripts/MacFaceGuard.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: MacFaceGuardCore
        embed: true
    entitlements:
      path: scripts/MacFaceGuard.entitlements
      properties:
        com.apple.security.device.camera: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.macfaceguard.local
schemes:
  MacFaceGuard:
    build:
      targets:
        MacFaceGuard: all
